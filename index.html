<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2458C6">
<title>Yatan Tech</title>
<meta name="description" content="Small, friendly puzzle games for your phone.">
<meta property="og:title" content="Yatan Tech">
<meta property="og:description" content="Small, friendly puzzle games for your phone.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root { color-scheme: light; --navy:#1C2646; --soft:#46536F; --blue:#2458C6; --red:#D9432B; --green:#17795A; --line:#D5DFF0; --pale:#F2F6FD; --tint:#EEF3FC; --empty:#DDE5F2; --warn:#FFF3D1; --warn-text:#4A3A05; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: #FFFFFF; }
body { color: var(--navy); font-family: "Fredoka", "Nunito", system-ui, -apple-system, sans-serif; font-size: 17px; line-height: 1.35; }
a { color: inherit; }
h1, h2, p, ol { margin: 0; padding: 0; }
img { display: block; max-width: 100%; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
.wrap { width: 100%; max-width: 520px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.bar { position: sticky; top: 0; z-index: 5; background: #FFFFFF; border-bottom: 1px solid #E1E7F2; }
.bar .wrap { height: 60px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; }
.bar.blue { background: var(--blue); border-bottom: 0; color: #FFFFFF; }
.bar .title { text-align: center; font-size: 18px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { width: 44px; height: 44px; display: grid; place-items: center; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.cta { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; padding: 8px 16px; border: 0; border-radius: 16px; background: var(--blue); color: #FFFFFF; font-size: 20px; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
.cta.off { background: var(--empty); color: var(--soft); cursor: default; }
.foot { display: flex; justify-content: center; gap: 12px; padding: 14px 0 24px; }
.foot a { display: flex; align-items: center; min-height: 44px; padding: 0 14px; font-size: 17px; font-weight: 600; }
.hero { padding-top: 20px; padding-bottom: 16px; display: grid; gap: 16px; }
.id { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 16px; align-items: center; }
.id img { width: 104px; height: 104px; border-radius: 24px; border: 1px solid #E1E7F2; }
.id h1 { font-size: 27px; line-height: 1.08; font-weight: 700; }
.id p { margin-top: 5px; font-size: 16px; color: var(--soft); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; }
.stats div { padding: 4px 0; }
.stats div + div { border-left: 1px solid #E1E7F2; }
.stats strong { display: block; font-size: 21px; font-weight: 700; }
.stats span { font-size: 14px; color: var(--soft); }
.shots { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding: 0 max(20px, calc((100% - 480px) / 2)) 6px; -webkit-overflow-scrolling: touch; }
.shots img { width: 172px; height: auto; flex: none; border-radius: 18px; scroll-snap-align: center; border: 1px solid #E1E7F2; }
.about { padding-top: 20px; display: grid; gap: 10px; }
.about h2 { font-size: 22px; font-weight: 700; }
.early { margin-top: 18px; padding: 16px; border-radius: 18px; background: var(--tint); display: grid; gap: 8px; }
.early h2 { font-size: 20px; font-weight: 700; }
.early p { font-size: 16px; color: var(--soft); }
.steps-page { padding-top: 18px; padding-bottom: 28px; display: grid; gap: 12px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.head h1 { font-size: 27px; line-height: 1.1; font-weight: 700; }
.head span { font-size: 16px; font-weight: 600; color: var(--soft); white-space: nowrap; }
.gauge { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 6px; border: 3px solid var(--navy); border-radius: 16px; }
.gauge i { display: block; height: 18px; border-radius: 8px; background: var(--empty); transition: background .25s; }
.gauge i.a { background: var(--g1); } .gauge i.b { background: var(--g2); } .gauge i.c { background: var(--g3); }
.list { list-style: none; display: grid; gap: 10px; margin-top: 4px; }
.num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; font-weight: 700; background: var(--empty); }
.open { padding: 14px; border-radius: 20px; background: var(--tint); border: 2px solid var(--blue); display: grid; gap: 12px; }
.open .top { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: center; }
.open .num { background: var(--blue); color: #FFFFFF; }
.open h2 { font-size: 22px; line-height: 1.1; font-weight: 700; }
.open p { color: var(--soft); }
.hintbox { padding: 12px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hintbox span { font-size: 15px; font-weight: 500; color: var(--soft); }
.hintbox b { padding: 7px 12px; border-radius: 10px; border: 2px solid var(--red); font-size: 16px; font-weight: 700; white-space: nowrap; }
.row { width: 100%; min-height: 60px; padding: 10px 14px; border-radius: 16px; display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; font-size: 18px; font-weight: 600; color: var(--navy); }
button.row { background: #FFFFFF; border: 1px solid var(--line); cursor: pointer; }
button.row .num { background: var(--green); color: #FFFFFF; }
button.row em { font-style: normal; font-size: 15px; color: var(--green); }
div.row { background: #F2F5FA; color: var(--soft); }
.warn { padding: 11px 14px; border-radius: 14px; background: var(--warn); color: var(--warn-text); font-size: 16px; font-weight: 500; }
.other { display: grid; gap: 10px; }
.other h2 { font-size: 20px; font-weight: 700; margin-top: 4px; }
.link-row { min-height: 72px; padding: 9px 12px; border-radius: 18px; border: 1px solid var(--line); display: grid; grid-template-columns: 54px minmax(0, 1fr) 24px; gap: 12px; align-items: center; text-decoration: none; font-size: 18px; font-weight: 600; background: #FFFFFF; }
.link-row img { width: 54px; height: 54px; border-radius: 13px; }
.chrome { padding: 14px; border-radius: 16px; background: var(--warn); color: var(--warn-text); display: grid; gap: 10px; font-size: 16px; font-weight: 500; }
.chrome .cta { min-height: 48px; font-size: 18px; background: var(--navy); }
.home-band { background: var(--blue); }
.home-top { color: #FFFFFF; padding-top: 18px; padding-bottom: 22px; }
.home-top p { font-size: 18px; font-weight: 600; }
.home-top h1 { margin-top: 12px; font-size: 34px; line-height: 1.08; font-weight: 700; text-wrap: balance; }
html:has(.home-page), .home-page { background: var(--pale); }
.cards { padding-top: 16px; display: grid; gap: 12px; }
.game { padding: 14px; border-radius: 22px; background: #FFFFFF; border: 1px solid var(--line); text-decoration: none; display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 14px; align-items: center; }
.game img { width: 88px; height: 88px; border-radius: 21px; }
.game strong { display: block; font-size: 21px; line-height: 1.1; font-weight: 700; }
.game small { display: block; margin-top: 3px; font-size: 16px; color: var(--soft); }
.game b { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 10px; border-radius: 13px; background: var(--red); color: #FFFFFF; font-size: 17px; font-weight: 700; }
.hub { padding-top: 24px; padding-bottom: 24px; display: grid; gap: 12px; }
.hub h1 { font-size: 34px; line-height: 1.08; font-weight: 700; }
.hub > p { margin-bottom: 8px; font-size: 18px; color: var(--soft); }
</style>
</head>
