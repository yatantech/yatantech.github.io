<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Line: Car Jam</title>
<meta name="description" content="Tap cars out of a packed lot and fill them up at the pump.">
<meta property="og:title" content="Fuel Line: Car Jam">
<meta property="og:description" content="Tap cars out of a packed lot and fill them up at the pump.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root { --bg:#F4F1EA; --card:#FFFFFF; --text:#1B2335; --soft:#5B6478; --line:#E3DED2; --accent:#128A5E; --on-accent:#FFFFFF; --tint:#E2F3EC; --off:#ECE8DE; --off-text:#6A7283; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --bg:#101623; --card:#1D2535; --text:#FFFFFF; --soft:#B8C0D0; --line:#2C3950; --accent:#5FE0B0; --on-accent:#0B2A1F; --tint:#17392F; --off:#273248; --off-text:#AEB7C8; color-scheme:dark; } }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); }
body { color:var(--text); font-family:"Fredoka","Nunito",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.45; padding-block:24px 40px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
main { max-width:520px; margin:0 auto; display:grid; gap:16px; min-width:0; }
h1 { font-size:32px; line-height:1.1; font-weight:700; margin:0; text-wrap:balance; }
h2 { font-size:22px; line-height:1.15; font-weight:600; margin:0; }
p { margin:0; }
a { color:var(--accent); }
.soft { color:var(--soft); }
.card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:16px; display:grid; gap:14px; min-width:0; }
.top { display:grid; grid-template-columns:84px minmax(0,1fr); gap:14px; align-items:center; }
.top img { width:84px; height:84px; border-radius:20px; display:block; }
.shots { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scroll-snap-type:x proximity; }
.shots img { height:320px; width:auto; max-width:none; border-radius:14px; flex:none; scroll-snap-align:start; display:block; }
.btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:52px; padding:10px 16px; border:0; border-radius:15px; font:600 18px "Fredoka",system-ui,sans-serif; text-decoration:none; text-align:center; cursor:pointer; background:var(--accent); color:var(--on-accent); }
.btn.off { background:var(--off); color:var(--off-text); cursor:default; }
.switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--off); border-radius:14px; }
.switch button { font:600 16px "Fredoka",system-ui,sans-serif; color:var(--soft); background:none; border:0; border-radius:11px; min-height:44px; cursor:pointer; }
.switch button[aria-pressed="true"] { background:var(--card); color:var(--text); }
.steps { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.step { display:grid; grid-template-columns:34px minmax(0,1fr); gap:12px; padding:12px; border-radius:16px; background:var(--off); }
.step.next { background:var(--tint); }
.num { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; background:var(--card); color:var(--text); }
.step.done .num { background:var(--accent); color:var(--on-accent); }
.step h3 { font-size:18px; font-weight:600; margin:3px 0 2px; }
.step p { color:var(--soft); font-size:15px; }
.step .btn { min-height:46px; font-size:16px; margin-top:10px; }
.step:not(.next) .btn { background:var(--card); color:var(--text); }
.note { font-size:15px; color:var(--soft); }
footer { color:var(--soft); font-size:14px; text-align:center; display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center; margin-top:6px; }
footer a { color:inherit; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>
</head>

<script>
/* Change these when this game's store status changes.
   APP_STORE: the App Store link once Apple has released the game (null shows "Coming soon").
   ANDROID_TEST: true while the Google Play closed test is live.
   PLAY_PUBLIC: true once the game is public on Google Play (Android becomes one button). */
var APP_STORE = null;
var ANDROID_TEST = true;
var PLAY_PUBLIC = false;
var GAME = "fuel-line", PKG = "com.yatantech.fuelline.game", GROUP = "https://groups.google.com/g/yatantech-testers";

function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
var ua = navigator.userAgent || "";
var isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
var platform = /Android/.test(ua) ? "android" : isIos ? "ios" : (load("yt-platform") || "android");
var STORE = "https://play.google.com/store/apps/details?id=" + PKG;
var STEPS = [
  { key: "yt-group", title: "Join our testers group", hint: "Tap Join group on the next page, then come back here.", label: "Join the group", url: GROUP },
  { key: "yt-opt-" + GAME, title: "Become a tester", hint: "Tap Become a tester on the next page, then come back here.", label: "Become a tester", url: "https://play.google.com/apps/testing/" + PKG },
  { key: "yt-inst-" + GAME, title: "Install the game", hint: "Opens Google Play. Tap Install.", label: "Open Google Play", url: STORE }
];
function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x) n.textContent = x; return n; }
function link(c, x, u, f) { var a = el("a", c, x); a.href = u; a.target = "_blank"; a.rel = "noopener"; if (f) a.addEventListener("click", f); return a; }
function render() {
  document.getElementById("pick-ios").setAttribute("aria-pressed", platform === "ios");
  document.getElementById("pick-android").setAttribute("aria-pressed", platform === "android");
  var box = document.getElementById("get"); box.textContent = "";
  if (platform === "ios") { box.appendChild(APP_STORE ? link("btn", "Download on the App Store", APP_STORE) : el("div", "btn off", "Coming soon to the App Store")); return; }
  if (PLAY_PUBLIC) { box.appendChild(link("btn", "Get it on Google Play", STORE)); return; }
  if (!ANDROID_TEST) { box.appendChild(el("div", "btn off", "Android testing opens soon")); return; }
  box.appendChild(el("p", "soft", "Three quick steps to play the early version on Android:"));
  var list = el("ol", "steps"), nextSet = false;
  STEPS.forEach(function (s, i) {
    var done = load(s.key) === "1", li = el("li", "step" + (done ? " done" : ""));
    if (!done && !nextSet) { li.className += " next"; nextSet = true; }
    li.appendChild(el("div", "num", done ? "\u2713" : String(i + 1)));
    var b = el("div"); b.style.minWidth = "0";
    b.appendChild(el("h3", "", s.title)); b.appendChild(el("p", "", s.hint));
    b.appendChild(link("btn", done ? "Open again" : s.label, s.url, function () { save(s.key, "1"); setTimeout(render, 300); }));
    li.appendChild(b); list.appendChild(li);
  });
  box.appendChild(list);
  box.appendChild(el("p", "note", "Use the same Google account for all three steps."));
}
function pick(p) { platform = p; save("yt-platform", p); render(); }
document.getElementById("pick-ios").addEventListener("click", function () { pick("ios"); });
document.getElementById("pick-android").addEventListener("click", function () { pick("android"); });
render();
</script>
